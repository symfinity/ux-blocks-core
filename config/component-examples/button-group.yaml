role: button-group
twig_name: ButtonGroup
groups:
  - id: grouped-actions
    section: Examples
    title: Grouped actions
    layout: inline-row
    items:
      - id: three-up
        label: Three actions
        props: {}
        slot_twig: |
          <twig:ButtonGroup>
              <twig:Button variant="primary">{{ lorem_words(1)|capitalize }}</twig:Button>
              <twig:Button variant="primary" appearance="outline">{{ lorem_words(1)|capitalize }}</twig:Button>
              <twig:Button variant="neutral" appearance="ghost">{{ lorem_words(1)|capitalize }}</twig:Button>
          </twig:ButtonGroup>
      - id: split-primary
        label: Primary pair
        props: {}
        slot_twig: |
          <twig:ButtonGroup>
              <twig:Button variant="primary">{{ lorem_words(1)|capitalize }}</twig:Button>
              <twig:Button variant="primary" appearance="outline">{{ lorem_words(1)|capitalize }}</twig:Button>
          </twig:ButtonGroup>
