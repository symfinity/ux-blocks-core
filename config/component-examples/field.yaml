role: field
twig_name: Field
groups:
  - id: default
    section: Default
    title: Default
    layout: stack
    items:
      - id: default-vertical
        label: Vertical
        props: {}
        slot_twig: |
          <twig:Field label="{{ lorem_words(1)|capitalize }}">
              <twig:Input type="email" name="email" placeholder="you@example.com" />
          </twig:Field>
  - id: disabled
    section: Disabled
    title: Disabled
    layout: stack
    items:
      - id: disabled-input
        label: Disabled
        props: {}
        slot_twig: |
          <twig:Field label="{{ lorem_words(1)|capitalize }}">
              <twig:Input name="username" :disabled="true" placeholder="Disabled" />
          </twig:Field>
  - id: invalid
    section: Invalid / validation
    title: Invalid / validation
    layout: stack
    items:
      - id: invalid-field
        label: Invalid
        props: {}
        slot_twig: |
          <twig:Field label="{{ lorem_words(1)|capitalize }}" error="{{ lorem_sentence() }}" :invalid="true">
              <twig:Input type="password" name="password" :invalid="true" />
          </twig:Field>
