role: page-heading
twig_name: PageHeading
groups:
  - id: examples
    section: Examples
    title: Page headings
    layout: stack
    items:
      - { id: basic, label: Title only, slot_twig: '<twig:PageHeading>{{ lorem_title() }}</twig:PageHeading>', props: {} }
      - { id: with-icon, label: With icon, slot_twig: '<twig:PageHeading icon="lucide:settings">{{ lorem_title() }}</twig:PageHeading>', props: {} }
      - { id: baseline-rhythm, label: Baseline rhythm, slot_twig: '<twig:PageHeading rhythm="baseline">{{ lorem_title() }}</twig:PageHeading>', props: {} }
