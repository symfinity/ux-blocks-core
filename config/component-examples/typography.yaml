role: typography
twig_name: Typography
groups:
  - id: variants
    section: Variants
    title: Variants
    layout: stack
    items:
      - { id: body, label: Body, slot_twig: '<twig:Typography>{{ lorem_sentence() }}</twig:Typography>', props: {} }
      - { id: lead, label: Lead, slot_twig: '<twig:Typography variant="lead">{{ lorem_sentence() }}</twig:Typography>', props: {} }
      - { id: muted, label: Muted, slot_twig: '<twig:Typography variant="muted">{{ lorem_sentence() }}</twig:Typography>', props: {} }
      - { id: prose, label: Prose, slot_twig: '<twig:Typography variant="prose">{{ lorem_paragraph() }}</twig:Typography>', props: {} }
